# nginx.conf  (copy to: /etc/nginx/conf.d/default.conf)

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing (React Router): refresh on deep routes won't 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache CRA hashed assets
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Optional: increase upload size (for Excel uploads, etc.)
  client_max_body_size 20M;

  # Optional: basic security headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
